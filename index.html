<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warning System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Retro Pixel Font */
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'DotGothic16', monospace;
            user-select: none;
        }

        /* Responsive full-bleed container hiding all outer edges & lines */
        .video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
            background-color: #000;
        }

        /* 
           Scales iframe far beyond 100% viewport dimensions to guarantee 
           zero black bars, lines, borders, titles, or UI elements on any aspect ratio
        */
        .video-wrapper iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 84.375vw; /* 16:9 ratio of 150vw */
            min-height: 150vh;
            min-width: 266.66vh; /* 16:9 ratio of 150vh */
            transform: translate(-50%, -50%) scale(1.3);
            pointer-events: none;
            border: none;
            outline: none;
            box-shadow: none;
        }

        /* Retro text formatting with multi-directional shadow for sharp legibility */
        .retro-text {
            color: #ffff00;
            text-shadow: 
                3px 3px 0 #000000,
                -3px -3px 0 #000000,
                3px -3px 0 #000000,
                -3px 3px 0 #000000,
                0px 0px 18px rgba(0, 0, 0, 0.95);
            line-height: 1.5;
            letter-spacing: 0.04em;
            word-break: break-word;
        }

        /* Fullscreen invisible trigger zone guaranteeing unmuted playback on any click */
        #startTrigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 50;
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 2rem;
            background: transparent;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative text-center">

    <!-- Zero-border Fullscreen Video Wrapper -->
    <div class="video-wrapper">
        <div id="player"></div>
    </div>

    <!-- Text Layer (Direct text without frames/borders/boxes) -->
    <div class="relative z-10 px-6 max-w-5xl mx-auto flex flex-col items-center justify-center min-h-screen pointer-events-none">
        <h1 class="retro-text text-2xl sm:text-4xl md:text-5xl font-bold leading-tight my-auto">
            あれ?読み込めば金もらえると思った?残念だったね このqrを読むと棒有名えrサイト(FA⭕️ZA PR⭕️NHUB)にリダイレクトされるようになってるんだ^^
        </h1>
    </div>

    <!-- Invisible Fullscreen Tap-to-Unmute Layer (Fallthrough trigger for browser autoplay rules) -->
    <div id="startTrigger">
        <div id="clickPrompt" class="text-white bg-black/80 px-4 py-2 rounded border border-yellow-400 text-sm sm:text-base animate-pulse">
            🔊 画面をタップ/クリックして音声をスタート
        </div>
    </div>

    <!-- YouTube API Embed -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let isAudioActivated = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'dQw4w9WgXcQ',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'iv_load_policy': 3,
                    'cc_load_policy': 0,
                    'cc_lang_pref': 'none',
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'loop': 1,
                    'playlist': 'dQw4w9WgXcQ',
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'origin': window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            // Unload captions dynamically if loaded
            try {
                event.target.unloadModule("captions");
            } catch (e) {}

            // Attempt unmuted auto-play immediately
            event.target.unMute();
            event.target.setVolume(100);
            
            const promise = event.target.playVideo();
            
            // If browser autoplay policy allows audio directly, hide prompt immediately
            if (promise !== undefined) {
                promise.then(() => {
                    if (!event.target.isMuted()) {
                        hidePrompt();
                    }
                }).catch(() => {
                    // Browser prevented unmuted autoplay; fallback to muted + user tap trigger
                    event.target.mute();
                    event.target.playVideo();
                });
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                player.playVideo();
            }
        }

        function hidePrompt() {
            const trigger = document.getElementById('startTrigger');
            if (trigger) {
                trigger.style.display = 'none';
            }
        }

        // Global trigger handling for guaranteed audio activation on load/tap
        function activateAudio() {
            if (isAudioActivated) return;
            if (player && typeof player.unMute === 'function') {
                player.unMute();
                player.setVolume(100);
                player.playVideo();
                isAudioActivated = true;
                hidePrompt();
            }
        }

        // Bind interactive triggers across entire screen
        const triggerEl = document.getElementById('startTrigger');
        triggerEl.addEventListener('click', activateAudio);
        triggerEl.addEventListener('touchstart', activateAudio);
        window.addEventListener('click', activateAudio);
        window.addEventListener('keydown', activateAudio);
    </script>
</body>
</html>
