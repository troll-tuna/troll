<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warning System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Classic Retro Pixel Font Import */
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'DotGothic16', monospace;
            user-select: none;
        }

        /* Fullscreen Video Container */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* Scaled and oversized iframe to hide controls, titles, and logos outside screen edges */
        .video-container iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140vw;
            height: 78.75vw; /* 16:9 ratio */
            min-height: 140vh;
            min-width: 248.88vh; /* 16:9 ratio */
            transform: translate(-50%, -50%) scale(1.25);
            pointer-events: none;
        }

        /* Retro Overlay Text Styling - High Contrast Yellow with Deep Black Shadow */
        .retro-text {
            color: #ffff00;
            text-shadow: 
                4px 4px 0px #000000,
                -4px -4px 0px #000000,
                4px -4px 0px #000000,
                -4px 4px 0px #000000,
                0px 0px 16px rgba(0, 0, 0, 0.95);
            line-height: 1.6;
            letter-spacing: 0.05em;
            word-break: break-word;
        }

        /* Scanline CRT overlay for retro atmosphere */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.05),
                rgba(0, 255, 0, 0.02),
                rgba(0, 0, 255, 0.05)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Audio prompt overlay */
        .audio-prompt {
            transition: opacity 0.3s ease-in-out;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1.0; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative text-center">

    <!-- Scanline visual effect -->
    <div class="scanlines"></div>

    <!-- YouTube Video Background Holder -->
    <div class="video-container">
        <div id="player"></div>
    </div>

    <!-- Main Text Content (No Dialog Boxes/Borders) -->
    <div class="relative z-20 px-6 max-w-5xl mx-auto flex flex-col items-center justify-center min-h-screen">
        <h1 class="retro-text text-2xl sm:text-4xl md:text-5xl font-bold leading-tight my-auto">
            あれ?読み込めば金もらえると思った?残念だったね このqrを読むと棒有名えrサイト(FA⭕️ZA PR⭕️NHUB)にリダイレクトされるようになってるんだ^^
        </h1>

        <!-- Audio prompt for bypass modern browser autoplay audio restrictions -->
        <div id="audioHint" class="audio-prompt text-white bg-black/70 border border-yellow-400 px-4 py-2 rounded-lg text-sm sm:text-base mb-8 tracking-wider">
            🔊 画面をタップ/クリックして音声を再生
        </div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;

        // Initialize YouTube Player with strict params to hide controls and captions
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'dQw4w9WgXcQ',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,          // Hide all controls
                    'disablekb': 1,          // Disable keyboard shortcuts
                    'fs': 0,                 // Disable fullscreen button
                    'iv_load_policy': 3,     // Hide video annotations
                    'cc_load_policy': 0,     // Hide closed captions/subtitles by default
                    'cc_lang_pref': 'none',  // Disable captions language preference
                    'modestbranding': 1,     // Minimize YouTube branding
                    'rel': 0,                // Do not show related videos
                    'showinfo': 0,           // Hide info bar
                    'loop': 1,               // Loop playback
                    'playlist': 'dQw4w9WgXcQ', // Loop requirement for iframe player
                    'playsinline': 1,
                    'enablejsapi': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            // Unload subtitles if loaded dynamically
            try {
                event.target.unloadModule("captions");
            } catch (e) {}

            // Mute first to ensure background autoplay works across all mobile & desktop browsers
            event.target.mute();
            event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            // Loop playback seamless restart
            if (event.data === YT.PlayerState.ENDED) {
                player.playVideo();
            }
        }

        // Global User Interaction Listener to Unmute Audio
        function enableAudio() {
            if (player && typeof player.unmute === 'function') {
                player.unmute();
                player.setVolume(100);
                player.playVideo();

                // Hide the audio hint once audio is active
                const hint = document.getElementById('audioHint');
                if (hint) {
                    hint.style.opacity = '0';
                    setTimeout(() => hint.remove(), 300);
                }
            }
        }

        // Bind global touch & click handlers
        window.addEventListener('click', enableAudio, { once: true });
        window.addEventListener('touchstart', enableAudio, { once: true });
        window.addEventListener('keydown', enableAudio, { once: true });
    </script>
</body>
</html>
