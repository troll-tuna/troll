<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>…</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  }
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  /* 背景動画: 画面全体を覆う */
  #v {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }
  /* 念のため、再生ボタン等のネイティブUIを全て隠す */
  #v::-webkit-media-controls,
  #v::-webkit-media-controls-panel,
  #v::-webkit-media-controls-play-button,
  #v::-webkit-media-controls-start-playback-button,
  #v::-webkit-media-controls-overlay-play-button {
    display: none !important;
    -webkit-appearance: none;
  }
  #v::cue { display: none; }

  .shade {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: rgba(0, 0, 0, .35);
    pointer-events: none;
  }
  .msg {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2em;
    padding: 0 6vw;
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .8);
    pointer-events: none;
  }
  .msg h1 {
    margin: 0;
    font-size: clamp(22px, 4.6vw, 56px);
    line-height: 1.4;
    font-weight: 800;
  }
  .msg p {
    margin: 0;
    font-size: clamp(16px, 2.6vw, 30px);
    line-height: 1.6;
    font-weight: 600;
  }
  /* 全面を覆って一切の操作を動画に触れさせない */
  .block { position: fixed; inset: 0; z-index: 3; }
</style>
</head>
<body>

<div class="bg" id="bg">
  <!-- rickroll.mp4 を index.html と同じフォルダに置く -->
  <video id="v" src="rickroll.mp4" autoplay loop playsinline
         disablepictureinpicture disableremoteplayback
         controlslist="nodownload nofullscreen noremoteplayback"
         tabindex="-1" aria-hidden="true"></video>
</div>
<div class="shade"></div>

<div class="msg">
  <h1>あれ?読み込めば金もらえると思った?<br>残念だったね</h1>
  <p>このQRを読むと某有名えrサイト<br>(FA⭕️ZA PR⭕️NHUB)にリダイレクトされるようになってるんだ^^</p>
</div>
<div class="block"></div>

<script>
  var v = document.getElementById('v');
  var bg = document.getElementById('bg');
  var frame = null;           // YouTube保険用iframe
  var EVENTS = ['pointerdown','mousedown','click','touchstart','touchend','keydown','wheel','scroll'];

  v.controls = false;
  Array.prototype.forEach.call(v.textTracks, function (t) { t.mode = 'disabled'; });

  function yt(fn, args) {
    if (frame && frame.contentWindow) {
      frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func: fn, args: args || [] }), '*');
    }
  }

  // 最初のユーザー操作で音を出す（video / YouTube どちらでも動く）
  function unmuteAll() {
    if (frame) {
      yt('unMute'); yt('setVolume', [100]);
    } else {
      v.muted = false;
      v.volume = 1;
      var pr = v.play();
      if (pr && pr.catch) pr.catch(function () {});
    }
    // video側は実際にミュートが外れたことを確認できてからリスナーを外す
    if (frame || !v.muted) {
      EVENTS.forEach(function (t) { window.removeEventListener(t, unmuteAll, true); });
    }
  }
  EVENTS.forEach(function (t) {
    window.addEventListener(t, unmuteAll, { capture: true, passive: true });
  });

  // 1) まず音ありで自動再生を試す
  v.muted = false;
  v.volume = 1;
  var p = v.play();
  if (p && p.then) {
    p.then(function () {
      // 音つき再生に成功したのでリスナーは不要
      if (!v.muted) EVENTS.forEach(function (t) { window.removeEventListener(t, unmuteAll, true); });
    }).catch(function () {
      // 2) ブロックされたら無音で再生開始 → 最初の操作で unmuteAll が音を出す
      v.muted = true;
      v.play().catch(function () {});
    });
  }

  // 動画ファイルが無い場合の保険: YouTube埋め込みに切り替える（UIは完全には消せません）
  v.addEventListener('error', function () {
    frame = document.createElement('iframe');
    frame.src = 'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0&disablekb=1&fs=0&modestbranding=1&rel=0&iv_load_policy=3&cc_load_policy=0&playsinline=1&loop=1&playlist=dQw4w9WgXcQ&enablejsapi=1';
    frame.allow = 'autoplay; encrypted-media';
    frame.tabIndex = -1;
    frame.setAttribute('aria-hidden', 'true');
    frame.style.cssText = 'position:absolute;top:50%;left:50%;width:max(100vw,177.78vh);height:max(56.25vw,100vh);transform:translate(-50%,-50%);border:0;pointer-events:none';
    bg.replaceChild(frame, v);
    // 切り替え後もう一度操作を待つ
    EVENTS.forEach(function (t) {
      window.addEventListener(t, unmuteAll, { capture: true, passive: true });
    });
  }, true);
</script>
</body>
</html>
