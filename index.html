<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>…</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  }

  /* 背景動画: 画面全体を覆う (object-fit: cover 相当) */
  .bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;   /* クリック・ホバーでYouTubeのUIが出ないようにする */
  }
  .bg iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    width: max(100vw, 177.78vh);
    height: max(56.25vw, 100vh);
    transform: translate(-50%, -50%);
    border: 0;
    pointer-events: none;
  }

  /* 文字を読みやすくするための薄い暗幕 */
  .shade {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: rgba(0, 0, 0, .35);
    pointer-events: none;
  }

  .msg {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2em;
    padding: 0 6vw;
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .8);
    pointer-events: none;
  }
  .msg h1 {
    margin: 0;
    font-size: clamp(22px, 4.6vw, 56px);
    line-height: 1.4;
    font-weight: 800;
  }
  .msg p {
    margin: 0;
    font-size: clamp(16px, 2.6vw, 30px);
    line-height: 1.6;
    font-weight: 600;
  }

  /* 全面タップで音を出す（ブラウザは自動再生を無音に制限するため） */
  .tap {
    position: fixed;
    inset: 0;
    z-index: 3;
    cursor: default;
    background: transparent;
  }
</style>
</head>
<body>

<div class="bg">
  <iframe
    id="yt"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0&disablekb=1&fs=0&modestbranding=1&rel=0&iv_load_policy=3&playsinline=1&loop=1&playlist=dQw4w9WgXcQ&enablejsapi=1&cc_load_policy=0"
    allow="autoplay; encrypted-media"
    referrerpolicy="strict-origin-when-cross-origin"
    tabindex="-1"
    aria-hidden="true"
    title="background video"></iframe>
</div>
<div class="shade"></div>

<div class="msg">
  <h1>あれ?読み込めば金もらえると思った?<br>残念だったね</h1>
  <p>このQRを読むと某有名えrサイト<br>(FA⭕️ZA PR⭕️NHUB)にリダイレクトされるようになってるんだ^^</p>
</div>

<div class="tap" id="tap"></div>

<script>
  // 最初のクリック/タップで音声をオンにする（IFrame APIをpostMessageで直接操作）
  var yt = document.getElementById('yt');
  function cmd(fn) {
    yt.contentWindow.postMessage(JSON.stringify({ event: 'command', func: fn, args: [] }), '*');
  }
  function unmute() {
    cmd('unMute');
    cmd('setVolume');
    cmd('playVideo');
    document.getElementById('tap').remove();
  }
  document.getElementById('tap').addEventListener('click', unmute, { once: true });
  document.getElementById('tap').addEventListener('touchstart', unmute, { once: true, passive: true });
</script>
</body>
</html>
